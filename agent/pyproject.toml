[project]
name = "vecta"
version = "0.1.0"
description = "Vecta server: agent orchestration, WebRTC media ingest and local GPU jobs"
requires-python = ">=3.14"
dependencies = [
    "aiortc",
    "av",
    "fastapi",
    "httpx",
    "numpy",
    "openai",
    "opencv-contrib-python",
    "pillow",
    "python-dotenv",
    "uvicorn[standard]",
]

[project.scripts]
vecta-server = "vecta.server.app:main"

[project.optional-dependencies]
# Local GPU jobs. The box has no system ROCm; PyTorch's rocm7.2 wheels bundle
# the runtime and only need the amdgpu kernel driver (Strix Halo = gfx1151).
gpu = [
    "mediapipe",
    "torch",
    "torchvision",
    "triton-rocm; sys_platform == 'linux'",  # torch's ROCm dep; listed so the index source applies
    "ultralytics",
]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio"]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["scripts/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
